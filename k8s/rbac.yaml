# RBAC for the Kubernetes terminal backend (terminal.backend: kubernetes).
#
# Grants the agent's ServiceAccount the minimum verbs needed to provision,
# exec into, and delete session pods IN ITS OWN NAMESPACE only. Session pods
# are stateless — there is no PVC surface.
#
# Replace the placeholders before applying:
#   <AGENT_NAMESPACE>   namespace where the Hermes pod runs (e.g. "hermes-agents")
#   <AGENT_SA>          ServiceAccount Hermes runs as (e.g. "hermes")
#
# Two Role variants ship below. Apply exactly ONE, matching
# terminal.kubernetes.provisioner:
#
#   provisioner: pod      -> hermes-session-exec     (pods + exec)
#   provisioner: sandbox  -> hermes-session-sandbox  (sandboxclaims + exec, NO
#                            bare pods/create and NO pod-authoring surface at
#                            all: the pod shape lives in the admin's
#                            SandboxTemplate, behind the cluster's admission
#                            stack — a meaningful reduction, since "create
#                            pods in a namespace" is close to namespace-admin
#                            without admission constraints)
#
# Pair either with k8s/networkpolicy.yaml (session pods otherwise reach every
# Service in the cluster) and, on non-OpenShift clusters, with
# k8s/validatingadmissionpolicy.yaml (provisioner: pod only — claims carry no
# pod spec to police).
---
# The session pods themselves run as this no-perms SA so they hold no cluster
# credentials. The backend's default base also sets
# automountServiceAccountToken: false on the pod itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-session-noperms
  namespace: <AGENT_NAMESPACE>
automountServiceAccountToken: false

---
# ── provisioner: pod ─────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-session-exec
  namespace: <AGENT_NAMESPACE>
rules:
  # Lifecycle of session pods. `get` also resolves the agent's OWN pod for the
  # ownerReference that garbage-collects session pods when the agent dies, and
  # reads pod status for readiness diagnostics (ImagePullBackOff,
  # CreateContainerConfigError, SCC denial) and the container list.
  # No `list`: the pod provisioner only ever addresses pods BY NAME, and
  # `list pods` would let a compromised agent enumerate every pod in the
  # namespace (the Hermes pod itself, any co-tenant) — which get-by-name does
  # not.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  # Streaming exec into the session pod. `get` is the verb that is actually
  # exercised: the python client upgrades via connect_get_namespaced_pod_exec,
  # a websocket GET, which kube-apiserver authorizes as `get`. `create` is kept
  # for kubectl-shaped tooling and client versions that POST; drop it if you
  # only ever run Hermes against this Role.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-session-exec
  namespace: <AGENT_NAMESPACE>
subjects:
  - kind: ServiceAccount
    name: <AGENT_SA>
    namespace: <AGENT_NAMESPACE>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-session-exec

---
# ── provisioner: sandbox (agent-sandbox + extensions) ────────────────────────
# Hermes creates a SandboxClaim against an admin-owned SandboxWarmPool and
# execs into the pod the claim is bound to. Note what is ABSENT:
#
#   * pods create/delete — the claim controller owns pod lifecycle;
#   * sandboxes create   — Hermes never authors a Sandbox (or a pod spec);
#   * sandboxtemplates / sandboxwarmpools write access — those are the
#     ADMIN's objects. They are the enforcement point on this path: whoever
#     can write the template defines what session pods are. Keep them out of
#     the agent's reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-session-sandbox
  namespace: <AGENT_NAMESPACE>
rules:
  # The claim lifecycle. No `watch`/`list`: readiness is polled with
  # get_namespaced_custom_object, always by name.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "delete"]
  # Read-only: resolve the bound Sandbox (claim.status.sandbox.name) to its
  # uid and pod name. Never created, never deleted — deleting the claim
  # cascades.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
  # Read-only, for `hermes doctor`'s pre-flight only (verify the configured
  # SandboxWarmPool exists and reports ready capacity). Never used at
  # runtime, and write access stays admin-only — the pool and its template
  # are the enforcement point on this path.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools"]
    verbs: ["get"]
  # Resolve the bound pod by name (readiness, container list, the
  # ownerReference proof that it belongs to our Sandbox).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # See the pod Role above: `get` is the verb the client actually exercises.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-session-sandbox
  namespace: <AGENT_NAMESPACE>
subjects:
  - kind: ServiceAccount
    name: <AGENT_SA>
    namespace: <AGENT_NAMESPACE>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-session-sandbox

---
# ── OpenShift only: SCC access for session pods ──────────────────────────────
# The default base leaves runAsUser unset, so session pods satisfy
# `restricted-v2`, which every authenticated SA already has via
# system:authenticated — so you do NOT need this on OpenShift 4.21.
#
# You DO need it if your terminal.kubernetes.pod_template (or, for
# provisioner: sandbox, your SandboxTemplate) pins
# spec.securityContext.runAsUser to a UID outside the namespace's
# openshift.io/sa.scc.uid-range, or sets spec.runtimeClassName to a runtime
# whose SCC differs. In
# that case create a custom SCC and bind `use` on it to the SESSION SA:
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: hermes-session-scc
#   namespace: <AGENT_NAMESPACE>
# rules:
#   - apiGroups: ["security.openshift.io"]
#     resources: ["securitycontextconstraints"]
#     resourceNames: ["<YOUR_CUSTOM_SCC>"]
#     verbs: ["use"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: hermes-session-scc
#   namespace: <AGENT_NAMESPACE>
# subjects:
#   - kind: ServiceAccount
#     name: hermes-session-noperms
#     namespace: <AGENT_NAMESPACE>
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: Role
#   name: hermes-session-scc
