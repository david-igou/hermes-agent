# ValidatingAdmissionPolicy constraining the shape of Hermes session pods.
#
# READ THIS BEFORE APPLYING ON OPENSHIFT.
#
# OpenShift's `restricted-v2` SCC already enforces a SUPERSET of the pod-shape
# rules the upstream sample checked: no host namespaces, allowPrivilegeEscalation
# false, drop ALL, no hostPath, no hostPort, a UID from the namespace range, and
# seccompProfile RuntimeDefault. On OpenShift 4.21 this policy therefore adds
# almost nothing for those rules — and a CLUSTER-WIDE binding with
# failurePolicy: Fail puts a new hard dependency in the admission path of every
# pod creation in the cluster, including openshift-* control-plane pods.
#
# So this version:
#   * keeps only the rules SCC does NOT give you (ServiceAccount allowlist,
#     no Secret/projected volumes, token unmounted),
#   * scopes the binding with a namespaceSelector instead of matchResources: {},
#   * is OPTIONAL on OpenShift and RECOMMENDED on vanilla Kubernetes.
#
# Requires Kubernetes >= 1.30 (ValidatingAdmissionPolicy GA) and cluster-admin
# to create. Label your Hermes namespace first:
#   kubectl label namespace <AGENT_NAMESPACE> hermes-agent/session-pods=enforce
#
# Honest limitation: enforcement hooks on a label the CREATOR chooses, so a
# fully compromised agent could omit `app.kubernetes.io/managed-by` to dodge the
# policy. The real containment boundary is the RBAC grant (k8s/rbac.yaml) plus,
# on OpenShift, SCC. Treat this as defense in depth, not as the thing that makes
# `pods/create` safe.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hermes-session-pod-security
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: created-by-serviceaccount
      expression: "request.userInfo.username.startsWith('system:serviceaccount:')"
    - name: is-hermes-session-pod
      expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'hermes-agent'
  variables:
    - name: sa
      expression: >-
        has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : 'default'
  validations:
    # --- rules SCC does NOT cover -------------------------------------------
    # Without this, "create pods" lets the agent name ANY ServiceAccount in the
    # namespace and inherit its permissions. The upstream sample only excluded
    # `default`, which is not the interesting case.
    - expression: "variables.sa == 'hermes-session-noperms'"
      message: "session pods must run as the hermes-session-noperms ServiceAccount"
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: "session pods must set automountServiceAccountToken: false"
    # A pod that can mount Secrets can exfiltrate every credential in the
    # namespace; a projected volume can re-mount a ServiceAccount token.
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.secret) && !has(v.projected))
      message: "session pods must not mount secret or projected volumes"
    # --- rules SCC also covers (kept for vanilla Kubernetes) -----------------
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: "hostNetwork is not allowed for session pods"
    - expression: "!has(object.spec.hostPID) || object.spec.hostPID == false"
      message: "hostPID is not allowed for session pods"
    - expression: "!has(object.spec.hostIPC) || object.spec.hostIPC == false"
      message: "hostIPC is not allowed for session pods"
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      message: "every container must set allowPrivilegeEscalation=false"
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(d, d == 'ALL'))
      message: "every container must drop ALL capabilities"
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath))
      message: "hostPath volumes are not allowed for session pods"
    # The backend sets runAsNonRoot at pod AND container level; keep a
    # regression floor on it. runAsUser is deliberately NOT constrained — on
    # OpenShift the SCC injects it from the namespace range.
    - expression: >-
        (has(object.spec.securityContext) &&
         has(object.spec.securityContext.runAsNonRoot) &&
         object.spec.securityContext.runAsNonRoot == true) ||
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) &&
          c.securityContext.runAsNonRoot == true)
      message: "session pods must set runAsNonRoot: true"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hermes-session-pod-security
spec:
  policyName: hermes-session-pod-security
  validationActions: ["Deny"]
  matchResources:
    # Scoped, NOT cluster-wide: a failurePolicy: Fail policy bound to every
    # namespace makes this webhook-free policy a dependency of all pod creation.
    namespaceSelector:
      matchLabels:
        hermes-agent/session-pods: enforce
